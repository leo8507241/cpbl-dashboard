name: CPBL 網路診斷（測試用）

on:
  workflow_dispatch:  # 僅手動觸發，不影響每日排程

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run CPBL network diagnostic
        run: python diagnostics/diagnostic_core.py
